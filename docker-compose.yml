services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itmo_queue
      POSTGRES_USER: itmo_queue
      POSTGRES_PASSWORD: itmo_queue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itmo_queue -d itmo_queue"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
